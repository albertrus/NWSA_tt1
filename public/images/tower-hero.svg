<svg viewBox="0 0 240 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telecommunications lattice tower">
  <!-- Sky gradient background circle -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1E88E5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1A1A1D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="120" cy="120" rx="120" ry="120" fill="url(#glow)"/>

  <!-- Guy wires -->
  <line x1="120" y1="80" x2="20" y2="390" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="4 2"/>
  <line x1="120" y1="80" x2="220" y2="390" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="4 2"/>
  <line x1="120" y1="140" x2="30" y2="390" stroke="#4A5568" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="120" y1="140" x2="210" y2="390" stroke="#4A5568" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Ground anchors -->
  <rect x="12" y="388" width="16" height="6" fill="#546E7A" rx="2"/>
  <rect x="212" y="388" width="16" height="6" fill="#546E7A" rx="2"/>
  <rect x="22" y="388" width="16" height="6" fill="#546E7A" rx="2"/>
  <rect x="202" y="388" width="16" height="6" fill="#546E7A" rx="2"/>

  <!-- Tower base platform -->
  <rect x="75" y="385" width="90" height="10" fill="#2D2D30" rx="3"/>
  <rect x="80" y="395" width="80" height="5" fill="#1A1A1D" rx="2"/>

  <!-- Tower left leg -->
  <line x1="85" y1="385" x2="108" y2="95" stroke="#1E88E5" stroke-width="4" stroke-linecap="round"/>
  <!-- Tower right leg -->
  <line x1="155" y1="385" x2="132" y2="95" stroke="#1E88E5" stroke-width="4" stroke-linecap="round"/>

  <!-- Horizontal members (bottom to top) -->
  <line x1="87" y1="350" x2="153" y2="350" stroke="#1E88E5" stroke-width="2.5"/>
  <line x1="90" y1="310" x2="150" y2="310" stroke="#1E88E5" stroke-width="2.5"/>
  <line x1="93" y1="270" x2="147" y2="270" stroke="#1E88E5" stroke-width="2.5"/>
  <line x1="96" y1="230" x2="144" y2="230" stroke="#1E88E5" stroke-width="2.5"/>
  <line x1="99" y1="190" x2="141" y2="190" stroke="#1E88E5" stroke-width="2.5"/>
  <line x1="102" y1="150" x2="138" y2="150" stroke="#1E88E5" stroke-width="2.5"/>
  <line x1="105" y1="115" x2="135" y2="115" stroke="#1E88E5" stroke-width="2"/>

  <!-- Diagonal cross-bracing (alternating) -->
  <line x1="87" y1="350" x2="150" y2="310" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="153" y1="350" x2="90" y2="310" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="90" y1="310" x2="147" y2="270" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="150" y1="310" x2="93" y2="270" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="93" y1="270" x2="144" y2="230" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="147" y1="270" x2="96" y2="230" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="96" y1="230" x2="141" y2="190" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="144" y1="230" x2="99" y2="190" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="99" y1="190" x2="138" y2="150" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="141" y1="190" x2="102" y2="150" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="102" y1="150" x2="135" y2="115" stroke="#546E7A" stroke-width="1"/>
  <line x1="138" y1="150" x2="105" y2="115" stroke="#546E7A" stroke-width="1"/>

  <!-- Platform / working level -->
  <rect x="100" y="112" width="40" height="5" fill="#2D2D30" rx="1"/>

  <!-- Antenna mast -->
  <line x1="120" y1="112" x2="120" y2="28" stroke="#FF5722" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Sector antenna panels (3 panels) -->
  <rect x="106" y="35" width="28" height="8" fill="#FF5722" rx="2"/>
  <rect x="106" y="48" width="28" height="8" fill="#FF5722" rx="2"/>
  <rect x="106" y="61" width="28" height="8" fill="#FF5722" rx="2"/>

  <!-- Microwave dish -->
  <ellipse cx="143" cy="75" rx="12" ry="9" fill="none" stroke="#00FF88" stroke-width="2"/>
  <line x1="131" y1="75" x2="121" y2="80" stroke="#00FF88" stroke-width="1.5"/>

  <!-- Aviation warning light (blinking red) -->
  <circle cx="120" cy="22" r="7" fill="#FF5722" opacity="0.9"/>
  <circle cx="120" cy="22" r="4" fill="#ffffff" opacity="0.5"/>

  <!-- Signal arcs emanating from top -->
  <path d="M 130 28 Q 155 18 155 8" fill="none" stroke="#1E88E5" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 2"/>
  <path d="M 132 32 Q 162 22 165 12" fill="none" stroke="#1E88E5" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 2"/>
  <path d="M 110 28 Q 85 18 85 8" fill="none" stroke="#1E88E5" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 2"/>
  <path d="M 108 32 Q 78 22 75 12" fill="none" stroke="#1E88E5" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 2"/>
</svg>
